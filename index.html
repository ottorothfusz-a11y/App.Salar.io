<style>
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
:root{--font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{background:#f5f3ef;color:#0b0a08;font-family:var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%}
/* ===== Inlogpagina ===== */
.lg-page{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at 50% 0%,rgba(217,186,121,.12),rgba(0,0,0,0) 60%),#f5f3ef;font-family:var(--font)}
.lg-card{width:100%;max-width:520px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(20,16,10,.14),0 0 0 1px rgba(20,16,10,.06)}
.lg-top{display:grid;place-items:center;padding:30px 20px;background:#0b0a08;border-bottom:1px solid rgba(217,186,121,.35)}
.lg-top img{height:64px;width:auto;display:block}
.lg-body{padding:40px 44px 28px}
.lg-step h1{font-size:30px;font-weight:800;letter-spacing:-.02em;color:#0b0a08}
.lg-sub{margin-top:10px;color:#5c564c;font-size:16px;line-height:1.5}
.lg-sub b{color:#0b0a08}
.lg-step label{display:block;margin-top:28px;font-size:14px;font-weight:600;color:#3a3732}
.lg-step input[type=email]{width:100%;margin-top:8px;height:56px;padding:0 18px;border:1px solid #d9d3c7;border-radius:12px;font:inherit;font-size:17px;color:#0b0a08;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
.lg-step input:focus{border-color:#b08a46;box-shadow:0 0 0 4px rgba(217,186,121,.22)}
.lg-step input.bad{border-color:#d9363e}
.lg-row{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:16px;color:#3a3732}
.lg-sw{position:relative;width:54px;height:32px;border-radius:99px;border:0;background:#cfc8bb;cursor:pointer;transition:background .25s;padding:0}
.lg-sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s}
.lg-sw.on{background:#0b0a08}.lg-sw.on i{transform:translateX(22px)}
.lg-btn{width:100%;height:60px;margin-top:24px;border:0;border-radius:12px;background:#0b0a08;color:#fff;font:700 17px var(--font);cursor:pointer;transition:background .2s,transform .1s}
.lg-btn:hover{background:#2a241a}.lg-btn:active{transform:scale(.99)}
.lg-btn.busy{opacity:.6;pointer-events:none}
.lg-err{margin-top:10px;color:#d9363e;font-size:14px}
.lg-note{margin-top:16px;padding:12px 14px;border-radius:10px;background:#f7f2e7;color:#5c4a26;font-size:14px;line-height:1.5}
.lg-back,.lg-link{border:0;background:none;padding:0;font:600 14px var(--font);color:#8a6a33;cursor:pointer}
.lg-back{margin-bottom:18px}
.lg-link{display:block;margin:16px auto 0}
.lg-code{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:26px}
.lg-code input{height:62px;text-align:center;font:700 26px var(--font);border:1px solid #d9d3c7;border-radius:12px;outline:none;color:#0b0a08}
.lg-foot{display:block;margin-top:28px;text-align:center;font-size:14px;color:#8d867a;text-decoration:none}
.lg-foot:hover{color:#0b0a08}
@media(max-width:480px){.lg-body{padding:30px 22px 22px}.lg-step h1{font-size:26px}.lg-code{gap:7px}.lg-code input{height:54px;font-size:22px}}
.lg-code input{width:100%;min-width:0;padding:0;box-sizing:border-box}

</style>
</head>

    <div class="lg-body">
      <!-- stap 1: e-mail -->
      <form class="lg-step" id="lg-1" novalidate>
        <h1>Inloggen</h1>
        <p class="lg-sub">We sturen een eenmalige code naar je e-mail.</p>
        <label for="lg-mail">E-mailadres</label>
        <input id="lg-mail" type="email" autocomplete="email" inputmode="email" placeholder="jij@bedrijf.nl" required>
        <div class="lg-row"><span id="lg-keep-l">Ingelogd blijven</span><button type="button" class="lg-sw on" id="lg-keep" role="switch" aria-checked="true" aria-labelledby="lg-keep-l"><i></i></button></div>
        <p class="lg-err" id="lg-err1" hidden>Vul een geldig e-mailadres in.</p>
        <button class="lg-btn" type="submit">Doorgaan</button>
      </form>
      <!-- stap 2: code -->
      <form class="lg-step" id="lg-2" novalidate hidden>
        <button type="button" class="lg-back" id="lg-back">← Ander e-mailadres</button>
        <h1>Check je e-mail</h1>
        <p class="lg-sub">Vul de 6-cijferige code in die we hebben gestuurd naar <b id="lg-to"></b>.</p>
        <div class="lg-code" id="lg-code">
          <input inputmode="numeric" maxlength="1" aria-label="Cijfer 1" autocomplete="one-time-code"><input inputmode="numeric" maxlength="1" aria-label="Cijfer 2"><input inputmode="numeric" maxlength="1" aria-label="Cijfer 3"><input inputmode="numeric" maxlength="1" aria-label="Cijfer 4"><input inputmode="numeric" maxlength="1" aria-label="Cijfer 5"><input inputmode="numeric" maxlength="1" aria-label="Cijfer 6">
        </div>
        <p class="lg-err" id="lg-err2" hidden>Vul alle 6 cijfers in.</p>
        <button class="lg-btn" type="submit">Inloggen</button>
        <button type="button" class="lg-link" id="lg-resend">Geen code ontvangen? Stuur opnieuw</button>
      </form>
      <p class="lg-note" id="lg-note" hidden></p>
      <a class="lg-foot" href="https://salarazimi.nl">salarazimi.nl</a>
    </div>
  </div>
</main>
<script>
(function(){
  // KOPPELING: zet hier de adressen van jullie inlogsysteem (backend).
  // Leeg = de pagina laat netjes weten dat inloggen nog niet beschikbaar is (er wordt dan niets verstuurd).
  var AUTH={sendCode:'',verifyCode:'',redirect:'/'};
  var f1=document.getElementById('lg-1'),f2=document.getElementById('lg-2'),mail=document.getElementById('lg-mail'),note=document.getElementById('lg-note'),sw=document.getElementById('lg-keep'),ins=[].slice.call(document.querySelectorAll('#lg-code input'));
  function msg(t){note.textContent=t;note.hidden=!t}
  sw.onclick=function(){var on=!sw.classList.contains('on');sw.classList.toggle('on',on);sw.setAttribute('aria-checked',on)};
  function post(u,d){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(d)}).then(function(r){if(!r.ok)throw r;return r.json().catch(function(){return{}})})}
  function busy(f,b){var x=f.querySelector('.lg-btn');x.disabled=b;x.classList.toggle('busy',b)}
  function send(){var e=mail.value.trim();
    if(!AUTH.sendCode){msg('Inloggen is binnenkort beschikbaar. Vragen? Mail naar info@salar-azimi.nl.');return}
    busy(f1,true);msg('');
    post(AUTH.sendCode,{email:e,remember:sw.classList.contains('on')}).then(function(){document.getElementById('lg-to').textContent=e;f1.hidden=true;f2.hidden=false;ins[0].focus()})
      .catch(function(){msg('Er ging iets mis. Probeer het zo nog eens.')}).then(function(){busy(f1,false)})}
  f1.addEventListener('submit',function(ev){ev.preventDefault();var ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail.value.trim());mail.classList.toggle('bad',!ok);document.getElementById('lg-err1').hidden=ok;if(ok)send()});
  document.getElementById('lg-back').onclick=function(){f2.hidden=true;f1.hidden=false;msg('');mail.focus()};
  document.getElementById('lg-resend').onclick=function(){send();msg('We hebben een nieuwe code gestuurd.')};
  ins.forEach(function(i,k){
    i.addEventListener('input',function(){i.value=i.value.replace(/\D/g,'').slice(-1);if(i.value&&ins[k+1])ins[k+1].focus();if(ins.every(function(x){return x.value}))f2.requestSubmit()});
    i.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!i.value&&ins[k-1])ins[k-1].focus()});
    i.addEventListener('paste',function(e){var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);if(!t)return;e.preventDefault();t.split('').forEach(function(c,j){if(ins[j])ins[j].value=c});(ins[t.length]||ins[5]).focus();if(t.length===6)f2.requestSubmit()})});
  f2.addEventListener('submit',function(ev){ev.preventDefault();var c=ins.map(function(x){return x.value}).join(''),ok=c.length===6;document.getElementById('lg-err2').hidden=ok;if(!ok)return;
    busy(f2,true);post(AUTH.verifyCode,{email:mail.value.trim(),code:c,remember:sw.classList.contains('on')}).then(function(r){location.href=(r&&r.redirect)||AUTH.redirect})
      .catch(function(){msg('Deze code klopt niet of is verlopen.');ins.forEach(function(x){x.value=''});ins[0].focus()}).then(function(){busy(f2,false)})});
})();
</script>

</body>
